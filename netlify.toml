[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://eventhorizon-design.com/*"
  to = "https://www.eventhorizon-design.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/trusted-partners"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/trusted-partners/"
  to = "/about/"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
