[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://eventhorizon-design.com/*"
  to = "https://www.eventhorizon-design.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/trusted-partners"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/trusted-partners/"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/transition-expertise/"
  to = "/portfolio/#transition-expertise"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/tha-park-ecovillage/"
  to = "/portfolio/#tha-park-ecovillage"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/rem-core-drilling/"
  to = "/portfolio/#rem-core-drilling"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/102-agency/"
  to = "/portfolio/#102-agency"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/synchronicity/"
  to = "/portfolio/#synchronicity"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/event-horizon-design/"
  to = "/portfolio/"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
