<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form definitions</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <form name="contact" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" tabindex="-1" autocomplete="off" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <select name="area">
        <option>Business analysis</option>
        <option>Digital project management</option>
        <option>Website project management</option>
        <option>Website design or delivery</option>
        <option>Digital marketing, SEO or AI visibility</option>
        <option>AI workflows or prompt engineering</option>
        <option>Social recruiting</option>
        <option>Not sure yet</option>
      </select>
      <textarea name="message"></textarea>
